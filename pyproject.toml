[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "meds-algorithm-retain"
version = "0.1.0"
description = "RETAIN (Choi et al., NeurIPS 2016) reverse-time attention model for MEDS, a supervised classifier behind the MEDS algorithm contract."
readme = "README.md"
authors = [{name = "Florent Pollet", email = "flo1.raymond@gmail.com"}]
license = "MIT"
license-files = ["LICENSE*"]

requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "meds-algorithm[data]==0.4.0a5",
  # torch carries the model itself: the official implementation is Theano 0.8 on Python 2.7, which is not
  # installable today, and `nn.GRU` is gate-for-gate identical to its `gru_layer` (see _model.py).
  "torch>=2.2",
  # numpy holds the ragged visit sequences; pyarrow backs the polars Parquet reads and writes.
  "numpy>=1.26",
  "pyarrow>=15",
]

[project.optional-dependencies]
orchestration = ["meds-algorithm[orchestration]==0.4.0a5"]
# meds-evaluation is pinned to the version MEDS-DEV evaluates predictions with.
test = ["meds-algorithm[conformance]==0.4.0a5"]

[project.urls]
Repository = "https://github.com/florian6973/meds-algorithm-retain"

[project.scripts]
retain-meds = "retain_meds.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retain_meds"]

# Keep one editable source; copy only portable defaults into the installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"configs/runs" = "retain_meds/resources/runs"
"algorithms" = "retain_meds/resources/algorithms"

[tool.hatch.build.targets.sdist]
include = ["/src", "/configs/runs", "/algorithms", "/tests", "/scripts", "/docs", "/README.md", "/RELEASING.md", "/CHANGELOG.md", "/LICENSE*", "/pyproject.toml", "/uv.lock"]
# The earlier layout's report records private cluster and dataset details; keep it out of the archive.
exclude = ["/docs/LEGACY_IMPLEMENTATION_REPORT.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "meds_dev: opt-in end-to-end execution through MEDS-DEV",
  "real_data: opt-in MIMIC-IV demo end-to-end conformance",
  "slow: integration tests that create isolated environments or run a full algorithm profile",
]
