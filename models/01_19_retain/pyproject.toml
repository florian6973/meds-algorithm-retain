[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retain"
version = "0.1.0"
description = "RETAIN implemented against the minimal MEDS model contract."
requires-python = ">=3.11"
# torch carries the model itself; the official implementation is Theano 0.8 on Python 2.7, which is not
# installable today, and `nn.GRU` is gate-for-gate identical to its `gru_layer`. polars/pyarrow read MEDS
# and write MEDS predictions, numpy carries the ragged visit sequences. These four are additions to the
# rendered scaffold and are recorded in IMPLEMENTATION_REPORT.md.
dependencies = [
  "pyyaml>=6",
  "numpy>=1.26",
  "polars>=1",
  "pyarrow>=15",
  "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "polars>=1", "pyarrow>=15", "meds-evaluation"]

[project.scripts]
meds-model = "retain.__main__:main"
meds-model-add-to-meds-dev = "meds_model_contract.meds_dev:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retain", "src/meds_model_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "meds_dev: opt-in end-to-end execution through MEDS-DEV",
  "real_data: opt-in MIMIC-IV demo end-to-end conformance",
  "slow: integration tests that create isolated environments or run a full DAG",
]
