# TECO's published architecture (JAMIA Open 8(2) ooaf026, Methods). Every value here is the paper's, and
# together they reproduce its reported 18 928 130 trainable parameters on a 25-feature input — see the
# `teco_parameter_count` doctest in `src/teco/model.py`, which is what pins `dim_feedforward` and the
# absence of a final LayerNorm, neither of which the paper states outright.
#
# Override any of it on the command line: `meds-model supervised_train model.d_model=256`.
_target_: teco.model.Model
optimizer: ${optimizer}

#: "the learning rate was set to 0.01 and reduced by a factor of 2 every 50 epochs". The interval is
#: epochs, not steps -- `Model.configure_optimizers` overrides the contract's default to say so.
scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  _partial_: true
  step_size: 50
  gamma: 0.5

#: "6 Transformer-encoder layers", "8 multi-head attention modules", "512-dimension vector",
#: "Gaussian Error Linear Unit as the activation function", "Dropout rate to 0".
d_model: 512
nhead: 8
num_layers: 6
dim_feedforward: 2048
dropout: 0.0

#: The alignment grid: "the mean of each variable in every 15-minute interval", over the 96 hours the
#: paper gives as the 24-hour sub-model's input range — 384 intervals.
interval_minutes: 15.0
lookback_hours: 96.0

#: Which encoder position the classification head reads. The paper does not say; `last` is the prediction
#: time itself, which is the question an encounter-level model re-scored every interval is answering.
#: `mean` pools the whole window. See "Assumptions" in IMPLEMENTATION_REPORT.md.
pooling: last
