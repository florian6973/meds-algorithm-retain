# @package _global_
# preprocess_data: external MEDS -> this model's patient representation.
# Creates <output_data_dir>/patients, the immutable base of the shared workspace.
defaults:
  - paths: default
  - _self_
  - profile: default

external_meds_dir: ???
output_data_dir: ${data_dir}

#: MEDS-transforms pipeline applied before tensorization. The shipped one fits the per-code numeric
#: quantiles that §2.4.4's composite pretraining targets are defined against, and writes them into
#: `metadata/codes.parquet` where tensorization carries them through. It bins nothing: PORTER's *inputs*
#: stay continuous and language-grounded, and only the training label is discretized (in `model.py`).
#: Set null to skip it — the composite target then degrades to the bare code, which is a deviation from
#: the paper rather than a configuration preference.
pipeline: ${oc.env:PORTER_PIPELINE,pkg://porter.pipelines.quantiles.yaml}
pipeline_overrides: []

#: Artifacts are immutable; set true to replace an existing patients/ directory.
do_overwrite: false

hydra:
  run: {dir: "${output_data_dir}/.logs"}
  job: {chdir: false}
