# @package _global_
# predict: produce standardized predictions for a task.
# Exactly one of the three sources below must be supplied, unless this model ships packaged weights.
# Ground truth is never read: only (subject_id, prediction_time) are taken from the task.
defaults:
  - paths: default
  - datamodule: task
  - model: default
  - trainer: default
  - optimizer: porter
  - _self_
  - profile: default

#: Optional: when omitted it is recovered from the source artifact's manifest, which is what lets a
#: caller point only at a model whose workspace lives elsewhere.
input_data_dir: null

#: A MEDS labels directory: any arrangement of *.parquet carrying
#: (subject_id, prediction_time, boolean_value). `meds-dev-task` writes train/0.parquet,
#: tuning/0.parquet, held_out/0.parquet -- those names are input *shard* names, not splits, and are
#: not read as such: which split a subject belongs to comes from the tokenized cohort in
#: input_data_dir. Dot-directories (meds-dev-task's .logs/) are skipped.
#: The model only ever sees (subject_id, prediction_time): boolean_value is dropped before the
#: batch is built, so it cannot read the answer it is about to be scored against.
external_labels_dir: ???

output_predictions_dir: ${predictions_dir}

#: Join boolean_value onto the finished predictions, *after* the model has run. meds-evaluation scores a
#: predictions file in isolation and rejects one without it, so this defaults on; set false for a file
#: that carries no ground truth at all.
attach_labels: true

#: null (the default) emits `predicted_boolean_value` as an all-null column: present, so
#: `meds-evaluation` can fetch it (see meds-evaluation#35), but carrying no invented decision. The
#: scorer then reports the threshold-free metrics — AUROC, AUPRC, Brier, calibration — and omits
#: accuracy and F1 rather than computing them against a cutoff this model never chose.
#:
#: Set a float to emit a real hard label, e.g. a cutoff picked on the tuning split.
decision_threshold: null

#: Mutually exclusive prediction sources.
input_supervised_model_dir: null
input_pretrained_model_dir: null
input_inference_subdir: null

#: Which splits to score; null means every split present in the task. Coverage of the selected splits is
#: enforced — a model that cannot score every timepoint fails rather than writing a short file.
splits: null

#: **Inert in the probe DAG**, and kept only so this config stays comparable with the other three:
#: `ProbePredictCommand` builds no datamodule at all. It reads the probe's manifest, loads the head,
#: and scores the embeddings `infer` already materialized — `probe_predict_frame` uses its own batch
#: size. These two matter for a `predict` implementation that re-runs the backbone, which this is not.
#:
#: §2.4.3: "The maximum effective context window was therefore 16,384 clinical events per patient."
#: meds-torch-data pads each sample to the longest sequence *in its batch*, not to this bound, so raising
#: it costs nothing on datasets with short timelines and is what admits long ones.
max_seq_len: 16384

#: Supplementary Table S4: "Max clinical events per batch 16,384", "Min patients per batch 1". The paper
#: fills a fixed *event* budget per batch by packing patients; meds-torch-data pads instead of packing, so
#: there is no way to express that here. `batch_size: 1` is the faithful reading — one patient, up to the
#: full 16,384-event context. On a dataset whose timelines are far shorter, raise it: the real constraint
#: is `batch_size * (longest timeline in the batch)`, and a batch of 32 thousand-event patients is much
#: closer to the paper's budget than 32 sixteen-thousand-event ones.
batch_size: 1
num_workers: 0

do_overwrite: false

hydra:
  run: {dir: "${log_dir}/predict"}
  job: {chdir: false}
