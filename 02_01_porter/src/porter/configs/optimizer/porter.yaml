# PORTER's pretraining optimizer, verbatim from arXiv:2606.24102 §2.4.4 and Supplementary Table S4:
# "AdamW with a peak learning rate of 5 x 10^-4, cosine decay with warmup, weight decay 0.05, gradient
# clipping at 1.0, Adam beta1 = 0.9, Adam beta2 = 0.95".
#
# Gradient clipping lives in `trainer/default.yaml` (`gradient_clip_val: 1.0`, which already matches), and
# the `cosine_with_min_lr` schedule in `Model.configure_optimizers` — it needs the total step count, which
# no config can express.
#
# The template's generic `optimizer/adamw.yaml` (lr 1e-3, weight decay 0.01) is left in place for
# comparison: select it with `optimizer=adamw`.
#
# The paper states no parameter grouping, so weight decay applies to every parameter, norm gains and
# biases included.
_target_: torch.optim.AdamW
_partial_: true
lr: 5.0e-4
weight_decay: 0.05
betas: [0.9, 0.95]
