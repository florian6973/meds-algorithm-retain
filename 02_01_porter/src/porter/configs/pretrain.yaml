# @package _global_
# pretrain: train a foundation model from patient data. No task is involved: a model that needs targets
# derives them internally.
defaults:
  - paths: default
  - datamodule: patients
  - model: default
  - trainer: default
  - callbacks: default
  - logger: csv
  - optimizer: porter
  - _self_
  - profile: default

input_data_dir: ${data_dir}
output_pretrained_model_dir: ${models.pretrained}

#: §2.4.3: "The maximum effective context window was therefore 16,384 clinical events per patient."
#: meds-torch-data pads each sample to the longest sequence *in its batch*, not to this bound, so raising
#: it costs nothing on datasets with short timelines and is what admits long ones.
max_seq_len: 16384

#: Supplementary Table S4: "Max clinical events per batch 16,384", "Min patients per batch 1". The paper
#: fills a fixed *event* budget per batch by packing patients; meds-torch-data pads instead of packing, so
#: there is no way to express that here. `batch_size: 1` is the faithful reading — one patient, up to the
#: full 16,384-event context. On a dataset whose timelines are far shorter, raise it: the real constraint
#: is `batch_size * (longest timeline in the batch)`, and a batch of 32 thousand-event patients is much
#: closer to the paper's budget than 32 sixteen-thousand-event ones.
batch_size: 1
num_workers: 0
seed: 0

do_overwrite: false
#: Resume from an interrupted run's work directory (not from a published artifact). Off by default: the
#: work directory is derived from the output path alone, so nothing checks that the checkpoint in it came
#: from this config, task or dataset, and `ckpt_path` restores optimizer state, LR-schedule position and
#: the epoch counter with the weights. Scratch lives at `<output_dir>.work` and is removed once the
#: artifact is published, so a checkpoint survives only a crash — exactly when the config gets changed
#: before the re-run. Turn this on to continue the *same* run; a changed config needs a fresh one.
do_resume: false

hydra:
  run: {dir: "${log_dir}/pretrain"}
  job: {chdir: false}
