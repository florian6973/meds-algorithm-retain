# PORTER's downstream head (arXiv:2606.24102 §2.7.1): L2-regularized logistic regression on the frozen
# representations, with features standardized using training-split statistics.
#
# Selected by supervised_train (`model: probe`), which injects `input_dim` from the width of the
# materialized embeddings. Note this group is NOT given `optimizer: ${optimizer}`: that group carries the
# *pretraining* optimizer (peak LR 5e-4, weight decay 0.05), and letting the probe inherit it would
# silently overwrite `l2`, which is the probe's whole hyperparameter.
_target_: porter.model.Probe

lr: 0.01

# The paper selects the inverse regularization strength C from {1, 1e-1, 1e-2, 1e-3, 1e-4} on the
# validation set. Under a mini-batch optimizer the correspondence is `weight_decay ~= 1 / (C * n_train)`.
# Sweep the paper's grid with:
#   meds-model supervised_train --multirun model.l2=1,0.1,0.01,0.001,0.0001
l2: 1.0e-4

# §2.7.1: "features standardized to zero mean and unit variance using statistics computed on the training
# subset of each task's split". Fitted in `Probe.on_train_start` and frozen into the checkpoint.
standardize: true
